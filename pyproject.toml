[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonargparse-slurm"
version = "0.1.0"
description = "SLURM deployment wrapper for Python scripts using jsonargparse"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "jsonargparse-slurm contributors"},
]
keywords = ["slurm", "jsonargparse", "hpc", "deployment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jsonargparse>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
jsap-slurm = "jsonargparse_slurm.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
